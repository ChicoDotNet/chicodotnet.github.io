name: validate
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: LTS
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compute dev build metadata
        id: meta
        shell: bash
        run: echo "date=$(date -u +%y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Generate static content
        env:
          RELEASE_DATE_UTC: ${{ steps.meta.outputs.date }}
          RELEASE_BUILD: 0
          RELEASE_CHANNEL: dev
        run: dotnet run --project tools/ChicoDotNet.ContentPipeline
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
