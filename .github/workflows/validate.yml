name: validate
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compute dev build metadata
        id: meta
        shell: bash
        run: |
          echo "date=$(date -u +%y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Generate static content
        env:
          RELEASE_DATE_UTC: ${{ steps.meta.outputs.date }}
          RELEASE_BUILD: 0
          RELEASE_CHANNEL: dev
        run: dotnet run --project tools/ChicoDotNet.ContentPipeline
      - run: npm install --no-audit --no-fund
      - run: npm run build
